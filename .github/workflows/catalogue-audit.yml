name: Catalogue image audit (temporary)

on:
  pull_request:
    paths: ['.github/workflows/catalogue-audit.yml']

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pillow requests
      - name: Measure product photos
        shell: python
        run: |
          import io, requests
          from PIL import Image, ImageStat
          base = "https://arun-karyana-backend.onrender.com"
          products = requests.get(base + "/products", timeout=90).json()["products"]
          print(f"{len(products)} products")
          for p in products:
              url = p.get("image") or ""
              if "res.cloudinary.com" in url and "/upload/" in url:
                  url = url.replace("/upload/", "/upload/w_400,c_limit,f_png/", 1)
              try:
                  img = Image.open(io.BytesIO(requests.get(url, timeout=30).content)).convert("RGB")
              except Exception as e:
                  print(f"{p['name'][:38]:38} | ERROR {e}")
                  continue
              w, h = img.size
              px = img.load()
              border = [px[x, 0] for x in range(w)] + [px[x, h - 1] for x in range(w)] + [px[0, y] for y in range(h)] + [px[w - 1, y] for y in range(h)]
              white = sum(1 for r, g, b in border if r > 235 and g > 235 and b > 235) / len(border)
              mean = tuple(int(sum(c[i] for c in border) / len(border)) for i in range(3))
              full = ImageStat.Stat(img).mean
              print(f"{p['name'][:38]:38} | {w}x{h} | border white {white:4.0%} | border mean {mean} | img mean {tuple(int(v) for v in full)}")
