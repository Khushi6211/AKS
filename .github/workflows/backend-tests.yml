name: Backend tests

on:
  pull_request:
    paths: ['main.py', 'requirements*.txt', 'tests/**', 'gunicorn.conf.py', '.github/workflows/backend-tests.yml']
  push:
    branches: [main]
    paths: ['main.py', 'requirements*.txt', 'tests/**', 'gunicorn.conf.py']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m py_compile main.py
      - run: pytest -q tests
