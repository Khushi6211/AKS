# Keeps the store's free Render server awake (it sleeps after 15 idle minutes, which makes the
# first visitor wait up to a minute) and records the server's health in the workflow log.
name: Store server health

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Wake the server and report its health
        run: |
          url="https://arun-karyana-backend.onrender.com/health"
          for attempt in 1 2 3 4 5 6; do
            code=$(curl -s -o health.json -w '%{http_code}' --max-time 70 "$url" || echo 000)
            echo "attempt $attempt: HTTP $code"
            [ "$code" = "200" ] && break
            sleep 10
          done
          echo "--- /health ---"
          cat health.json 2>/dev/null || true
          echo
          [ "$code" = "200" ]

      - name: Catalogue snapshot (manual runs only)
        if: github.event_name == 'workflow_dispatch'
        run: |
          base="https://arun-karyana-backend.onrender.com"
          echo "--- categories ---"; curl -s --max-time 60 "$base/categories"; echo
          echo "--- products ---"; curl -s --max-time 60 "$base/products" | jq -c '.products // . | .[]? | {id: ._id, name, price, category, stock, image}'
          echo "--- offers ---"; curl -s --max-time 60 "$base/offers"; echo
          echo "--- banner ---"; curl -s --max-time 60 "$base/banners/active"; echo
          echo "--- reviews ---"; curl -s --max-time 60 "$base/reviews/featured"; echo
