<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Forgot password · Arun Karyana Store</title>
    <meta name="description" content="Reset the password for your Arun Karyana Store account.">
    <meta name="theme-color" content="#f2eee6">
    <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
    <link rel="preload" href="assets/fonts/inter-tight-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="assets/vendor/fontawesome/css/all.min.css">
    <link rel="stylesheet" href="assets/css/app.css?v=79a45731fd">
    <link rel="stylesheet" href="assets/css/pages.css?v=c675bdf3e1">
</head>
<body class="page" data-page="forgot">
    <div class="grain-overlay" aria-hidden="true"></div>
    <header class="nav page-nav solid" id="nav">
        <div class="nav-in">
            <a href="index.html" class="brand" aria-label="Arun Karyana Store — home"><b>Arun Karyana</b><span class="deva-mark" aria-hidden="true">अ</span><small>EST. 1977</small></a>
            <nav class="nav-links" aria-label="Primary">
                <a href="index.html#shop">Shop</a>
                <a href="index.html#aisles">Aisles</a>
                <a href="index.html#story">Story</a>
                <a href="index.html#visit">Visit</a>
            </nav>
            <div class="nav-actions">
                <a href="login.html" class="icon-btn" id="acct-link" aria-label="Sign in"><i class="far fa-user"></i></a>
                <a href="index.html?cart=open" class="bag-btn" aria-label="Open bag"><i class="fas fa-bag-shopping bag-ic" aria-hidden="true"></i><span class="t">Bag</span><span class="bag-count" id="cart-count">0</span></a>
            </div>
        </div>
    </header>

    <main class="auth">
        <aside class="auth-art" aria-hidden="true">
            <img src="assets/img/grains-1977.jpg" alt="">
            <div class="cap"><span class="label"><span class="n">●</span> It happens to everyone</span><p class="h2">Let’s get you <em>back in.</em></p></div>
        </aside>
        <section class="auth-panel">
            <div class="auth-box">
                <a class="back" href="login.html"><i class="fas fa-arrow-left"></i> Back to sign in</a>
                <div>
                    <h1 class="h1">Forgot your <em>password?</em></h1>
                    <p class="lede" style="margin-top:14px">Enter the email you signed up with and we’ll send you a link to choose a new one.</p>
                </div>
                <div id="auth-msg" role="status" hidden></div>
                <form class="form" id="forgot-form" novalidate>
                    <div class="field"><label for="forgot-email">Email</label><input id="forgot-email" type="email" autocomplete="email" required></div>
                    <button class="btn" type="submit">Send reset link <span class="ar"><i class="fas fa-arrow-right"></i></span></button>
                </form>
                <div class="done-card" id="forgot-done" hidden></div>
                <p class="auth-foot">Store owner? Change your password any time from Dashboard → My account.</p>
            </div>
        </section>
    </main>

    <div class="toasts" id="toasts" aria-live="polite"></div>
    <script src="config.js?v=7474b03af7"></script>
    <script src="assets/js/auth.js?v=829609dc60"></script>
    <script src="assets/js/account.js?v=0998126611"></script>
</body>
</html>
