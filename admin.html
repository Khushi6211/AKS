<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Store dashboard · Arun Karyana Store</title>
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#12100e">
    <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="stylesheet" href="assets/vendor/fontawesome/css/all.min.css">
    <link rel="stylesheet" href="assets/css/app.css?v=79a45731fd">
    <link rel="stylesheet" href="assets/css/admin.css?v=1c6be83c08">
</head>
<body class="dash">
    <div class="gate" id="gate">
        <div>
            <span class="label no-rule"><span class="n">●</span> Store dashboard</span>
            <p class="h2" id="gate-title">Opening the shop…</p>
            <p id="gate-text">Checking your sign-in. The first visit after a quiet spell can take up to a minute.</p>
            <div id="gate-actions"></div>
        </div>
    </div>

    <div class="dash-shell" id="app" hidden>
        <aside class="side" aria-label="Dashboard">
            <a href="index.html" class="brand" target="_blank" rel="noopener"><b>Arun Karyana</b><small>DASHBOARD</small></a>
            <nav id="side-nav">
                <button type="button" data-view="today"><i class="fas fa-sun"></i>Today</button>
                <button type="button" data-view="orders"><i class="fas fa-receipt"></i>Orders<span class="count" data-count="pending" hidden></span></button>
                <button type="button" data-view="products"><i class="fas fa-box"></i>Products</button>
                <button type="button" data-view="categories"><i class="fas fa-layer-group"></i>Categories</button>
                <span class="sep"></span>
                <button type="button" data-view="offers"><i class="fas fa-tag"></i>Offers</button>
                <button type="button" data-view="banner"><i class="fas fa-bullhorn"></i>Announcement bar</button>
                <button type="button" data-view="popup"><i class="fas fa-window-maximize"></i>Welcome pop-up</button>
                <span class="sep"></span>
                <button type="button" data-view="customers"><i class="fas fa-users"></i>Customers</button>
                <button type="button" data-view="reviews"><i class="fas fa-star"></i>Reviews</button>
                <button type="button" data-view="messages"><i class="fas fa-envelope"></i>Messages<span class="count" data-count="messages" hidden></span></button>
                <span class="sep"></span>
                <button type="button" data-view="account"><i class="fas fa-user-gear"></i>My account</button>
            </nav>
            <div class="foot">
                <a href="index.html" target="_blank" rel="noopener"><i class="fas fa-arrow-up-right-from-square"></i>&nbsp; View the store</a>
                <button type="button" data-logout style="text-align:left;color:var(--on-night)"><i class="fas fa-arrow-right-from-bracket"></i>&nbsp; Log out</button>
            </div>
        </aside>
        <div>
            <header class="top">
                <a href="index.html" class="brand" target="_blank" rel="noopener"><b>Arun Karyana</b><small>DASHBOARD</small></a>
                <h1 id="view-title">Today</h1>
                <span class="grow"></span>
                <span class="who" id="who"></span>
                <a class="qbtn" href="index.html" target="_blank" rel="noopener"><i class="fas fa-store"></i><span class="hide-sm">Store</span></a>
                <button class="icon-btn" type="button" data-view="account" aria-label="My account"><i class="far fa-user"></i></button>
            </header>
            <main class="view" id="view" aria-live="polite"></main>
        </div>
    </div>

    <nav class="tabbar" id="tabbar" aria-label="Sections" hidden>
        <button type="button" data-view="today"><i class="fas fa-sun"></i>Today</button>
        <button type="button" data-view="orders"><i class="fas fa-receipt"></i>Orders<span class="dot" data-count="pending" hidden></span></button>
        <button type="button" data-view="products"><i class="fas fa-box"></i>Products</button>
        <button type="button" data-view="offers"><i class="fas fa-tag"></i>Offers</button>
        <button type="button" data-view="more"><i class="fas fa-bars"></i>More<span class="dot" data-count="messages" hidden></span></button>
    </nav>

    <div class="sheet-scrim" id="sheet-scrim"></div>
    <aside class="sheet" id="sheet" aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
        <div class="sheet-head"><h2 id="sheet-title"></h2><button class="icon-btn" type="button" data-close-sheet aria-label="Close"><i class="fas fa-xmark"></i></button></div>
        <div class="sheet-body" id="sheet-body"></div>
        <div class="sheet-foot" id="sheet-foot"></div>
    </aside>

    <div class="toasts" id="toasts" aria-live="polite"></div>

    <script src="config.js?v=7474b03af7"></script>
    <script src="assets/js/auth.js?v=829609dc60"></script>
    <script src="assets/js/admin.js?v=7ffac78cf3"></script>
</body>
</html>
